spring.application.name=capstone

# Quote feature config
# quote.source-url=https://example.com/api/quotes
quote.source-url=
quote.fetch-timeout-ms=3000

# H2 (in-memory) settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:capstone;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
